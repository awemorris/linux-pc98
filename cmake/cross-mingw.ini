[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
ranlib = 'x86_64-w64-mingw32-ranlib'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = '/home/awe/qemu-win64/root/bin/x86_64-w64-mingw32-pkg-config'
pkgconfig = '/home/awe/qemu-win64/root/bin/x86_64-w64-mingw32-pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-I/home/awe/qemu-win64/root/include']
cpp_args = ['-I/home/awe/qemu-win64/root/include']
c_link_args = ['-L/home/awe/qemu-win64/root/lib']
cpp_link_args = ['-L/home/awe/qemu-win64/root/lib']
